openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
paths:
  /api/v1/users:
    post:
      tags:
      - user-controller
      operationId: createUser
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
  /api/v1/sessions:
    post:
      tags:
      - session-controller
      operationId: createOrGetSession
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionContextDTO"
  /api/v1/sessions/{sessionId}/refresh:
    post:
      tags:
      - session-controller
      operationId: refreshSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionContextDTO"
  /api/v1/auth/reset-password:
    post:
      tags:
      - authentication-controller
      operationId: resetPassword
      parameters:
      - name: userName
        in: query
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/refresh:
    post:
      tags:
      - authentication-controller
      operationId: refresh
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - authentication-controller
      operationId: logout
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - authentication-controller
      operationId: login
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
  /api/v1/auth/introspect:
    post:
      tags:
      - authentication-controller
      operationId: introspect
      parameters:
      - name: accessToken
        in: query
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IntrospectionResponse"
  /api/v1/sessions/{sessionId}:
    get:
      tags:
      - session-controller
      operationId: getSessionById
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionContextDTO"
    delete:
      tags:
      - session-controller
      operationId: invalidateSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/sessions/{sessionId}/validate:
    get:
      tags:
      - session-controller
      operationId: validateSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /api/v1/sessions/permission-check:
    get:
      tags:
      - session-controller
      operationId: checkPermission
      parameters:
      - name: partyId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: actionType
        in: query
        required: true
        schema:
          type: string
      - name: resourceType
        in: query
        required: false
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /api/v1/sessions/party/{partyId}:
    get:
      tags:
      - session-controller
      operationId: getSessionByPartyId
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionContextDTO"
    delete:
      tags:
      - session-controller
      operationId: invalidateSessionsByPartyId
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/sessions/access-check:
    get:
      tags:
      - session-controller
      operationId: checkAccess
      parameters:
      - name: partyId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /api/v1/identity/subjects:
    post:
      tags:
      - identity-controller
      operationId: resolveSubject
      summary: Authenticate or resolve the actor
      description: "IdentityPort. Returns the subject AccessPort evaluates. Does not\
        \ call an identity provider from the caller. Sandbox usernames are sample-journey,\
        \ sample-employee, and denied-actor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRequest"
            example:
              username: sample-journey
      responses:
        "200":
          description: The subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
              example:
                actorId: 11111111-1111-4111-8111-111111111111
                provider: sandbox
                roles: []
        "400":
          description: Neither username nor actorId was provided.
        "404":
          description: The subject is unknown.
  /api/v1/access/checks:
    post:
      tags:
      - access-controller
      operationId: decideAccess
      summary: Decide whether an actor may access a resource
      description: "AccessPort check. Returns HTTP 200 for both allowed and denied\
        \ outcomes. The body carries allowed and reasonCode. The controller calls\
        \ AccessPort and does not decide allow or deny itself."
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequest"
            example:
              actorId: 11111111-1111-4111-8111-111111111111
              action: READ
              resourceType: ACCOUNT
              resourceId: 10000000-0000-4000-8000-000000000002
      responses:
        "200":
          description: Access decision. allowed is true or false, with a reasonCode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessDecision"
              examples:
                granted:
                  summary: Sample actor may read the sample account
                  value:
                    allowed: true
                    reasonCode: SANDBOX_GRANT
                denied:
                  summary: Second actor is denied
                  value:
                    allowed: false
                    reasonCode: ACTOR_NOT_ENTITLED
        "400":
          description: The request is missing actorId, action, resourceType, or resourceId.
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        partyId:
          type: string
          format: uuid
        userRole:
          type: string
          enum:
          - AGENT
          - SUPER_AGENT
          - DISTRIBUTOR
          - ADMIN
        attributes:
          type: object
          additionalProperties:
            type: object
    CreateUserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    ContractInfoDTO:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
        contractNumber:
          type: string
        contractStatus:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        contractPartyId:
          type: string
          format: uuid
        roleInContract:
          $ref: "#/components/schemas/RoleInfoDTO"
        product:
          $ref: "#/components/schemas/ProductInfoDTO"
        dateJoined:
          type: string
          format: date-time
        dateLeft:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomerInfoDTO:
      type: object
      properties:
        partyId:
          type: string
          format: uuid
        partyKind:
          type: string
        tenantId:
          type: string
          format: uuid
        fullName:
          type: string
        preferredLanguage:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        taxIdNumber:
          type: string
        isActive:
          type: boolean
    ProductInfoDTO:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productCatalogId:
          type: string
          format: uuid
        productSubtypeId:
          type: string
          format: uuid
        productName:
          type: string
        productCode:
          type: string
        productDescription:
          type: string
        productType:
          type: string
        productStatus:
          type: string
        launchDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
    RoleInfoDTO:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/RoleScopeInfoDTO"
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
    RoleScopeInfoDTO:
      type: object
      properties:
        scopeId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        scopeCode:
          type: string
        scopeName:
          type: string
        description:
          type: string
        actionType:
          type: string
        resourceType:
          type: string
        isActive:
          type: boolean
        resourceId:
          type: string
          description: Optional resource identifier. Absent or * covers every resource of resourceType.
    SessionContextDTO:
      type: object
      properties:
        sessionId:
          type: string
        partyId:
          type: string
          format: uuid
        customerInfo:
          $ref: "#/components/schemas/CustomerInfoDTO"
        activeContracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractInfoDTO"
        createdAt:
          type: string
          format: date-time
        lastAccessedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - INVALIDATED
          - LOCKED
        metadata:
          $ref: "#/components/schemas/SessionMetadataDTO"
    SessionMetadataDTO:
      type: object
      properties:
        channel:
          type: string
        sourceApplication:
          type: string
        deviceInfo:
          type: string
        geolocation:
          type: string
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    AuthenticationResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        idToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        sessionId:
          type: string
        partyId:
          type: string
          format: uuid
    AuthLogoutRequest:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        sessionId:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        scope:
          type: string
    IntrospectionResponse:
      type: object
      properties:
        active:
          type: boolean
        scope:
          type: string
        username:
          type: string
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        sub:
          type: string
        aud:
          type: array
          items:
            type: string
        iss:
          type: string
        jti:
          type: string
        partyId:
          type: string
          format: uuid
        userRole:
          type: string
          enum:
          - AGENT
          - SUPER_AGENT
          - DISTRIBUTOR
          - ADMIN
    AccessRequest:
      type: object
      required:
      - actorId
      - action
      - resourceType
      - resourceId
      properties:
        actorId:
          type: string
          description: Identifier of the actor. Compared without regard to case or surrounding spaces.
        action:
          type: string
          enum:
          - READ
          - CREATE
          - UPDATE
          - CLOSE
          - DECIDE
          - ADMINISTER
          - IMPERSONATE
        resourceType:
          type: string
          enum:
          - PARTY
          - ACCOUNT
          - CARD
          - APPLICATION
          - POLICY
          - CLAIM
          - CONTRACT
          - PRODUCT
        resourceId:
          type: string
          description: Identifier of the resource. Compared without regard to case or surrounding spaces.
    AccessDecision:
      type: object
      required:
      - allowed
      - reasonCode
      properties:
        allowed:
          type: boolean
          description: True when the actor may perform the action. False when the actor is denied.
        reasonCode:
          type: string
          description: "Why the decision was allowed or denied. Sandbox codes: SANDBOX_GRANT,\
            \ ACTOR_NOT_ENTITLED, ACTOR_UNKNOWN, ACTION_NOT_GRANTED, RESOURCE_NOT_GRANTED,\
            \ REQUEST_INCOMPLETE. Session-grant codes also include SESSION_GRANT and\
            \ SESSION_UNAVAILABLE."
          example: SANDBOX_GRANT
    IdentityRequest:
      type: object
      properties:
        username:
          type: string
          description: Username to authenticate. Sandbox values are sample-journey, sample-employee, and denied-actor.
        actorId:
          type: string
          description: Actor id to resolve when username is omitted.
        password:
          type: string
          description: Passed only to the selected Jafly adapter. The sandbox adapter ignores it.
    Subject:
      type: object
      required:
      - actorId
      - provider
      - roles
      properties:
        actorId:
          type: string
        provider:
          type: string
          enum:
          - sandbox
          - keycloak
          - cognito
          - internal-db
        roles:
          type: array
          items:
            type: string
          description: Realm roles from the identity provider. Empty for sandbox subjects.
